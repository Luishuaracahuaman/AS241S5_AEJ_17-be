name: Docker Hub Back-End

on:
  push:
    branches:
      - develop
      - webflux-nosql
  pull_request:
    branches:
      - develop
      - webflux-nosql
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  dockerhub:
    name: Build and Push Back-End Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME_LUIS }}
          password: ${{ secrets.DOCKERHUB_TOKEN_LUIS }}

      - name: Build and Push Docker Image to Docker Hub
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME_LUIS }}/as241s5_aej_17-be:latest
            ${{ secrets.DOCKERHUB_USERNAME_LUIS }}/as241s5_aej_17-be:${{ github.sha }}