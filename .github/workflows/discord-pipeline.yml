name: Pipeline - Notificaciones Discord

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  discord-alert:
    name: Enviar Alerta a Discord
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Enviar mensaje enriquecido a Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl -H "Content-Type: application/json" \
          -d '{
            "embeds": [{
              "title": "🚀 Integración de Pipeline Exitosa",
              "description": "Se ha detectado y procesado un nuevo cambio en el código fuente.",
              "color": 5763719,
              "author": {
                "name": "Usuario: ${{ github.actor }}",
                "icon_url": "https://github.com/${{ github.actor }}.png",
                "url": "https://github.com/${{ github.actor }}"
              },
              "fields": [
                {
                  "name": "📦 Repositorio",
                  "value": "[${{ github.event.repository.name }}](https://github.com/${{ github.repository }})",
                  "inline": true
                },
                {
                  "name": "🌿 Rama",
                  "value": "`${{ github.ref_name }}`",
                  "inline": true
                },
                {
                  "name": "🔍 Detalles del Código",
                  "value": "[Haga clic aquí para ver los archivos modificados](https://github.com/${{ github.repository }}/commit/${{ github.sha }})",
                  "inline": false
                }
              ],
              "footer": {
                "text": "IESTP Valle Grande - APIs IA",
                "icon_url": "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png"
              }
            }]
          }' \
          $DISCORD_WEBHOOK