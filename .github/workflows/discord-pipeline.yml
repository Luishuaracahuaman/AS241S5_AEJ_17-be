name: Pipeline - Notificaciones Discord

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  discord-alert:
    name: Enviar Alerta a Discord
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Enviar mensaje ultra enriquecido a Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl -H "Content-Type: application/json" \
          -d '{
            "embeds": [{
              "title": "🚀 Ejecución de Pipeline Completada",
              "description": "El flujo de CI/CD **${{ github.workflow }}** se ha integrado correctamente.",
              "color": 5763719,
              "author": {
                "name": "Autor del cambio: ${{ github.actor }}",
                "icon_url": "https://github.com/${{ github.actor }}.png",
                "url": "https://github.com/${{ github.actor }}"
              },
              "fields": [
                {
                  "name": "📦 Repositorio",
                  "value": "[${{ github.event.repository.name }}](https://github.com/${{ github.repository }})",
                  "inline": true
                },
                {
                  "name": "🌿 Rama / Evento",
                  "value": "`${{ github.ref_name }}` (Evento: `${{ github.event_name }}`)",
                  "inline": true
                },
                {
                  "name": "🔍 1. Revisar Código Modificado",
                  "value": "[💻 Clic aquí para ver el Commit exacto](https://github.com/${{ github.repository }}/commit/${{ github.sha }})",
                  "inline": false
                },
                {
                  "name": "⚙️ 2. Revisar Logs del Servidor",
                  "value": "[▶️ Clic aquí para ver consola de GitHub Actions](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})",
                  "inline": false
                }
              ],
              "footer": {
                "text": "IESTP Valle Grande - APIs IA | Proyecto Final",
                "icon_url": "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png"
              }
            }]
          }' \
          $DISCORD_WEBHOOK